plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chet.voserviceframe'
    compileSdk 36

    defaultConfig {
        applicationId 'com.chet.voserviceframe'
        minSdk 31
        targetSdk 36
        versionCode 100
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
