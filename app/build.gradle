plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chet.voserviceframe'
    compileSdk 36

    defaultConfig {
        applicationId 'com.chet.voserviceframe'
        minSdk 31
        targetSdk 36
        versionCode 102
        versionName '1.0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sign the release build with the standard debug keystore so the
            // GitHub Actions artifact is directly installable for testing.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
